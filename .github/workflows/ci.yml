name: CI

on:
  push:
  pull_request:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        toit-version: [ oldest, latest ]
        include:
          - toit-version: oldest
            version-name: old
          - toit-version: latest
            version-name: new

    name: CI - ${{ matrix.os }} - ${{ matrix.version-name }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Toit version
        id: toit-version
        shell: bash
        run: |
          if [[ "${{ matrix.toit-version }}" == "oldest" ]]; then
            sdk=$(grep -E '^[[:space:]]+sdk:' package.yaml | head -1 \
              | sed -E 's/^[[:space:]]+sdk:[[:space:]]*//; s/^\^//' \
              | tr -d "\"' ")
            echo "version=v$sdk" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: toitlang/action-setup@v1
        with:
          toit-version: ${{ steps.toit-version.outputs.version }}

      - name: Start httpbin - Linux
        if: runner.os == 'Linux'
        run: |
          docker pull kennethreitz/httpbin
          docker run -d -p 8765:80 kennethreitz/httpbin
          docker ps

      - name: Run cmake
        run:
          make rebuild-cmake

      - name: Enable httpbin tests - Linux
        if: runner.os == 'Linux'
        run: |
          docker ps
          cmake -DENABLE_HTTPBIN_TESTS=ON -DUSE_HTTPBIN_DOCKER=ON build

      # httpbin.org is overloaded at the moment, so if we are not running our
      # own in Docker, don't run it at all.
      - name: Enable httpbin tests - non-Linux
        if: runner.os != 'Linux'
        run: |
          cmake -DENABLE_HTTPBIN_TESTS=OFF build

      - name: Test
        run: |
          make test
